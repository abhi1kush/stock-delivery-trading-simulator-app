[package]
name = "simulator-core"
version = "1.0.0"
edition = "2021"
description = "Causal long-only delivery-trade backtester"
license = "MIT"
publish = false

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"

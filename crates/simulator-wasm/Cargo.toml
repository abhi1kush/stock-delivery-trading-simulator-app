[package]
name = "simulator-wasm"
version = "1.0.0"
edition = "2021"
description = "WebAssembly bindings for the delivery-trade backtester"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
simulator-core = { path = "../simulator-core" }
wasm-bindgen = "0.2"
serde_json = "1"
console_error_panic_hook = "0.1"
